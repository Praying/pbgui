<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="icon" type="image/svg+xml" href="/app/favicon.svg">
<!-- boot.js must run before the bundle: the app reads window.__BOOT__ at
       mount time. The legacy page's %%API_BASE%%/%%WS_BASE%%/%%INSTANCE%%/
       %%IS_NEW%%/%%DRAFT_ID%%/%%RUN_VERSION%%/%%MASTER_NAME%% injections are
       gone — config.ts derives the /api/v7|v8 base and the run version from
       boot.js plus the serving route's path (/api/v7/edit_page vs
       /api/v8/edit_page); name/new/draft_id come from the query string. The
       same Vue build serves both routes. -->
  <script src="/api/boot.js"></script>
  <!-- legacy i18n engine: still drives pbgui_nav.js labels -->
  <script src="/app/i18n.js?v=1"></script>
  <title>PBv7 Edit</title>
  <!-- resizable sidebar chrome, same files as legacy v7_edit.html:8 -->
  <link rel="stylesheet" href="/app/css/sidebar.css?v=1">
  <script src="/app/js/sidebar_resize.js?v=1"></script>
  <!-- Shared legacy globals, same loading order as legacy v7_edit.html
       :1216-1220/:3995: PBGuiDialogs drives the 409 save/copy blocks,
       LogViewerPanel hosts the floating log panel, shared_help_overlay the
       Guide button (the page-local unescaped mdToHtml overlay is dropped). -->
  <script src="/app/js/pbgui_dialogs.js?v=6"></script>
  <script src="/app/js/log_viewer_panel.js?v=30"></script>
  <script src="/app/js/shared_help_overlay.js?v=7"></script>
</head>
<body>
  <div id="app"></div>
  <!-- Shared legacy chrome, same loading order as legacy v7_edit.html
       :3931-3938: NAV_CONFIG must exist before pbgui_nav.js fills #topnav.
       The edit page highlights the RUN nav entry (runEditorAdapter
       navCurrent) with the EDIT subtitle; the values derive from
       location.pathname — the same signal config.ts uses. -->
  <script>
    (function () {
      var isV8 = /\/api\/v8\/edit_page/.test(window.location.pathname);
      window.PBGUI_NAV_CONFIG = {
        subtitle: (window.PBGuiI18n ? PBGuiI18n.t('editor.run.editNavSubtitle', { version: isV8 ? '8' : '7' }) : (isV8 ? 'PBv8 EDIT' : 'PBv7 EDIT')),
        current:  isV8 ? 'v8_run' : 'v7_run',
        apiBase:  ((window.__BOOT__ || {}).origin || '') + (isV8 ? '/api/v8' : '/api/v7'),
        version:  (window.__BOOT__ || {}).version || '',
        serial:   (window.__BOOT__ || {}).serial || ''
      };
    })();
  </script>
  <script src="/app/pbgui_nav.js"></script>
  <script type="module" src="./main.ts"></script>
</body>
</html>
