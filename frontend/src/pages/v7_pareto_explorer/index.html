<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="icon" type="image/svg+xml" href="/app/favicon.svg">
<!-- boot.js must run before the bundle: the app reads window.__BOOT__ at
       mount time. The legacy page's %%API_BASE%%/%%WS_BASE%%/%%RESULT_PATH%%/
       %%OPTIMIZE_VERSION%%/%%VERSION%%/%%SERIAL%% injections are gone —
       config.ts derives the pareto API base from boot.js origin, RESULT_PATH
       + the version seed from the query string. This is the ONLY v7/v8 page
       served by ONE route: the flavor is NOT derived from the pathname but
       from ?optimize_version= (seed) + the runtime per-result resolution in
       composables/useParetoSession.ts (recon §4). -->
  <script src="/api/boot.js"></script>
  <!-- Legacy i18n remains available to shared browser helpers. -->
  <script src="/app/i18n.js?v=1"></script>
  <title>PBGui - Pareto Explorer</title>
  <!-- Stage nav converged into the workbench rail; the legacy resizable
       sidebar chrome (sidebar.css + sidebar_resize.js) is no longer loaded. -->
  <!-- Plotly stays a vendored script global. Legacy pareto loads it from the
       dedicated /static route (legacy :10) — NOT /app/plotly.min.js like
       backtest. Kept on /static for parity; standardising to one global
       happens at module closeout (M-v7-18, recon R5). -->
  <script src="/static/plotly.min.js"></script>
  <!-- Shared JSON panel global for the selected-config full-config viewer
       (legacy :1644; same pattern as v7_strategy_explorer). -->
  <script src="/app/js/json_panel.js?v=2"></script>
</head>
<body>
  <div id="app"></div>
  <script src="/app/js/shared_help_overlay.js?v=7"></script>
  <script type="module" src="./main.ts"></script>
</body>
</html>
