<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/svg+xml" href="/app/favicon.svg">
<!-- boot.js must run before the bundle: config derives the API base from
       window.__BOOT__ (dashboard_main/index.html convention) -->
  <script src="/api/boot.js"></script>
  <!-- legacy i18n engine, same as dashboard_editor.html:10 -->
  <script src="/app/i18n.js?v=1"></script>
  <title>Dashboard Editor</title>
  <!-- Vendor globals, same files as dashboard_editor.html:12-13 (R2: loaded
       externally, not bundled — avoids a 4.6 MB bundle and version drift) -->
  <script src="/app/plotly.min.js?v=1"></script>
  <script src="/app/vendor/lightweight-charts.standalone.production.js?v=1"></script>
</head>
<body>
  <div id="app"></div>
  <!-- Shared legacy dialogs (dashboard_templates iframe convention; the
       legacy editor never needed PBGuiDialogs, and the script is inert).
       NOTE: no pbgui_nav.js — the legacy editor iframe has no #topnav. -->
  <script src="/app/js/pbgui_dialogs.js?v=8"></script>
  <script type="module" src="./main.ts"></script>
</body>
</html>
