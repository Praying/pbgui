  <script src="/app/i18n.js?v=1"></script>

</head>

  <!-- The cleanup-date calendar keeps the legacy __dp global; the sync-job
       log panel hosts the LogViewerPanel global. -->

  <script src="/app/js/log_viewer_panel.js?v=30"></script>
  <script type="module" src="./main.ts"></script>
</body>
