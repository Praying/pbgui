<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- boot.js must run before the bundle: the app reads window.__BOOT__ at mount time -->
  <script src="/api/boot.js"></script>
  <!-- legacy i18n engine: still drives PBGuiDialogs labels (loaded below) -->
  <script src="/app/i18n.js?v=1"></script>
  <title>Market Data Status</title>
</head>
<body>
  <!-- data-exchange is injected by the route (serve branch of
       /api/market-data/status-monitor/{exchange}); query param and the
       status-monitor path segment are the standalone fallbacks. -->
  <div id="mds-app" data-exchange=""></div>
  <!-- Shared legacy dialogs, same loading order as frontend/market_data_status.html:
       PBGuiDialogs.confirm drives the stop-run confirmation. No nav scripts —
       this page is a monitor fragment, not a top-level page. -->
  <script src="/app/js/pbgui_dialogs.js?v=6"></script>
  <script type="module" src="./main.ts"></script>
</body>
</html>
