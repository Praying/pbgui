<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="icon" type="image/svg+xml" href="/app/favicon.svg?v=2">
<!-- boot.js must run before the bundle: the app reads window.__BOOT__ at
       mount time. The legacy page's %%API_BASE%%/%%WS_BASE%%/%%RUN_VERSION%%/
       %%VERSION%%/%%SERIAL%%/%%MASTER_NAME%% injections are gone — config.ts
       derives the /api/v7|v8 base and the run version from boot.js plus the
       serving route's path (/api/v7/main_page vs /api/v8/main_page); the same
       Vue build serves both routes. -->
  <script src="/api/boot.js"></script>
  <!-- Legacy i18n remains available to PBGuiDialogs and shared help. -->
  <script src="/app/i18n.js?v=1"></script>
  <title>PBv7 Run</title>
  <!-- Filters and instance actions moved into the page toolbar; the legacy
       resizable sidebar chrome (sidebar.css + sidebar_resize.js) is gone. -->
  <!-- PBGuiDialogs.alert/confirm drive the V8-conversion notice and the
       permanent backup-delete confirmation (legacy v7_run.html:10) -->
  <script src="/app/js/pbgui_dialogs.js?v=8"></script>
</head>
<body>
  <div id="app"></div>
  <script src="/app/js/shared_help_overlay.js?v=8"></script>
  <script type="module" src="./main.ts"></script>
</body>
</html>
