<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="icon" type="image/svg+xml" href="/app/favicon.svg">
<!-- boot.js must run before the bundle: the app reads window.__BOOT__ at
       mount time. The legacy page's %%API_BASE%%/%%WS_BASE%%/%%RUN_VERSION%%/
       %%VERSION%%/%%SERIAL%%/%%MASTER_NAME%% injections are gone — config.ts
       derives the /api/v7|v8 base and the run version from boot.js plus the
       serving route's path (/api/v7/main_page vs /api/v8/main_page); the same
       Vue build serves both routes. -->
  <script src="/api/boot.js"></script>
  <!-- legacy i18n engine: still drives the nav subtitle and PBGuiDialogs labels -->
  <script src="/app/i18n.js?v=1"></script>
  <title>PBv7 Run</title>
  <!-- resizable sidebar chrome, same files as legacy v7_run.html:8-9 -->
  <link rel="stylesheet" href="/app/css/sidebar.css?v=1">
  <!-- PBGuiDialogs.alert/confirm drive the V8-conversion notice and the
       permanent backup-delete confirmation (legacy v7_run.html:10) -->
  <script src="/app/js/pbgui_dialogs.js?v=6"></script>
  <script src="/app/js/sidebar_resize.js?v=1"></script>
</head>
<body>
  <div id="app"></div>
  <!-- Shared legacy chrome, same loading order as legacy v7_run.html:1464-1475:
       NAV_CONFIG must exist before pbgui_nav.js, which fills #topnav. The
       current/subtitle keys depend on the serving route (v7 or v8), so they
       are derived from location.pathname here — the same signal config.ts
       uses (run_list_adapter.js is dropped; its logic lives in config.ts). -->
  <script>
    (function () {
      var isV8 = /\/api\/v8(\/|$)/.test(window.location.pathname);
      window.PBGUI_NAV_CONFIG = {
        subtitle: (window.PBGuiI18n ? PBGuiI18n.t('editor.run.navSubtitle', { version: isV8 ? '8' : '7' }) : (isV8 ? 'PBv8 RUN' : 'PBv7 RUN')),
        current:  isV8 ? 'v8_run' : 'v7_run',
        token:    (window.__BOOT__ || {}).token || '',
        apiBase:  ((window.__BOOT__ || {}).origin || '') + (isV8 ? '/api/v8' : '/api/v7'),
        version:  (window.__BOOT__ || {}).version || '',
        serial:   (window.__BOOT__ || {}).serial || ''
      };
    })();
  </script>
  <script src="/app/pbgui_nav.js"></script>
  <script type="module" src="./main.ts"></script>
</body>
</html>
