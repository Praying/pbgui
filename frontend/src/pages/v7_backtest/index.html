<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <!-- boot.js must run before the bundle: the app reads window.__BOOT__ at
       mount time. The legacy page's %%TOKEN%%/%%API_BASE%%/%%WS_BASE%%/
       %%BACKTEST_VERSION%% injections are gone — config.ts derives the API
       base + flavour from boot.js origin + the serving route's pathname
       (/api/backtest-v7|v8/main_page, the v7_run pattern). The v7 router's
       TOKEN injection was help-overlay-only (recon R13): bootToken() now
       covers that consumer. -->
  <script src="/api/boot.js"></script>
  <!-- legacy i18n engine: drives pbgui_nav.js labels -->
  <script src="/app/i18n.js?v=1"></script>
  <title>PBGui — Backtest</title>
  <!-- resizable sidebar chrome, same files as legacy v7_backtest.html:9-12 -->
  <link rel="stylesheet" href="/app/css/sidebar.css?v=4">
  <script src="/app/js/sidebar_resize.js?v=1"></script>
  <!-- Plotly loads with the M-v7-10 results charts (legacy :8 uses
       /app/plotly.min.js — the module-wide standard, recon R5). -->
</head>
<body>
  <div id="app"></div>
  <!-- Shared legacy chrome: NAV_CONFIG must exist before pbgui_nav.js
       fills #topnav. Subtitle/current are computed client-side from the
       pathname flavour (legacy :1021-1022) — not injected. -->
  <script>
    (function () {
      var isV8 = /\/api\/backtest-v8(\/|$)/.test(window.location.pathname);
      var boot = window.__BOOT__ || {};
      window.PBGUI_NAV_CONFIG = {
        subtitle: (window.PBGuiI18n ? PBGuiI18n.t('v7backtest.navSubtitle', { version: isV8 ? 'PBv8' : 'PBv7' }) : (isV8 ? 'PBv8' : 'PBv7') + ' BACKTEST'),
        current:  isV8 ? 'v8_backtest' : 'v7_backtest',
        apiBase:  (boot.origin || '') + (isV8 ? '/api/backtest-v8' : '/api/backtest-v7'),
        version:  boot.version || '',
        serial:   boot.serial || ''
      };
    })();
  </script>
  <script src="/app/pbgui_nav.js"></script>
  <script type="module" src="./main.ts"></script>
</body>
</html>
