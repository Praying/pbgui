<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="/app/favicon.svg?v=2">
<!-- boot.js must run before the bundle: REST auth uses the cookie session
       plus the boot token (the legacy data-token injection is gone). -->
  <script src="/api/boot.js"></script>
  <!-- legacy i18n engine, same as hl_data_actions.html:7 (nav-less page) -->
  <script src="/app/i18n.js?v=1"></script>
  <title>Hyperliquid Data Actions - PBGui</title>
  <script>
    // embedded detection (legacy :512-515): shrink chrome inside iframes.
    // Runs before the bundle so the hlda-embedded CSS applies on first paint.
    if (window.self !== window.top) {
      document.documentElement.classList.add('hlda-embedded');
      document.addEventListener('DOMContentLoaded', function () {
        document.body.classList.add('hlda-embedded');
      });
    }
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
