  <!-- legacy i18n engine remains available to the shared help overlay -->
  <script src="/app/i18n.js?v=1"></script>

</head>
<body>
  <div id="app"></div>
  <!-- Legacy editor_shared.js is dropped: Vue owns the multiselect controller. -->
  <script src="/app/js/shared_help_overlay.js?v=8"></script>
  <script type="module" src="./main.ts"></script>
</body>
</html>
