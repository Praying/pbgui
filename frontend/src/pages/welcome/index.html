<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <link rel="icon" type="image/svg+xml" href="/app/favicon.svg">
<!-- boot.js must run before the bundle: the app reads window.__BOOT__ at
         mount time. The legacy %%TOKEN%%/%%API_ORIGIN%%/%%VERSION%%/%%SERIAL%%
         injections are gone — config.ts derives them from boot.js at runtime. -->
    <script src="/api/boot.js"></script>
    <!-- legacy i18n engine: still drives the nav subtitle -->
    <script src="/app/i18n.js?v=1"></script>
    <title>PBGui - Welcome</title>
</head>
<body>
    <div id="app"></div>
    <!-- Shared legacy chrome, same loading order as legacy welcome.html
         :922-976,1589-1595: pbgui_dialogs for the disable-auth confirm,
         shared_help_overlay for the nav Guide button, NAV_CONFIG before
         pbgui_nav.js (the config is re-synced from the app at runtime). -->
    <script src="/app/js/pbgui_dialogs.js?v=6"></script>
    <script>
        document.title = (window.PBGuiI18n ? PBGuiI18n.t('misc.welcome.title') : 'PBGui - Welcome');
        window.PBGUI_NAV_CONFIG = {
            subtitle: (window.PBGuiI18n ? PBGuiI18n.t('misc.welcome.subtitle') : 'WELCOME'),
            current: '/',
            token: (window.__BOOT__ || {}).token || '',
            apiBase: ((window.__BOOT__ || {}).origin || window.location.origin) + '/api',
            version: (window.__BOOT__ || {}).version || '',
            serial: (window.__BOOT__ || {}).serial || ''
        };
    </script>
    <script src="/app/js/shared_help_overlay.js?v=7"></script>
    <script src="/app/pbgui_nav.js"></script>
    <script type="module" src="./main.ts"></script>
</body>
</html>
