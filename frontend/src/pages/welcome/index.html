<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <link rel="icon" type="image/svg+xml" href="/app/favicon.svg">
<!-- boot.js must run before the bundle: the app reads window.__BOOT__ at
         mount time. The legacy %%TOKEN%%/%%API_ORIGIN%%/%%VERSION%%/%%SERIAL%%
         injections are gone — config.ts derives them from boot.js at runtime. -->
    <script src="/api/boot.js"></script>
    <!-- Legacy i18n remains available to shared dialogs and help. -->
    <script src="/app/i18n.js?v=1"></script>
    <title>PBGui - Welcome</title>
</head>
<body>
    <div id="app"></div>
    <!-- Shared dialogs and help remain page dependencies; AppShell owns
         product navigation for the Vue build. -->
    <script src="/app/js/pbgui_dialogs.js?v=6"></script>
    <script src="/app/js/shared_help_overlay.js?v=7"></script>
    <script type="module" src="./main.ts"></script>
</body>
</html>
