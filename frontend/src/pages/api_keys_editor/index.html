<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="PBGui api keys editor">
      <link rel="icon" type="image/svg+xml" href="/app/favicon.svg?v=2">
<!-- boot.js must run before the bundle: the app reads window.__BOOT__ at
         mount time. The legacy %%TOKEN%%/%%API_BASE%%/%%VERSION%%/%%SERIAL%%
         injections are gone — config.ts derives them from boot.js at runtime. -->
    <script src="/api/boot.js"></script>
    <!-- legacy i18n engine remains available to shared scripts -->
    <script src="/app/i18n.js?v=1"></script>
    <title>API Keys - PBGui</title>
</head>
<body>
    <div id="app"></div>
    <!-- Shared bridges retained for logs, dialogs, and the page help opener. -->
    <script src="/app/js/log_viewer_panel.js?v=30"></script>
    <script src="/app/js/pbgui_dialogs.js?v=8"></script>
    <script src="/app/js/shared_help_overlay.js?v=8"></script>
    <script type="module" src="./main.ts"></script>
</body>
</html>
