<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="/app/favicon.svg">
<!-- boot.js must run before the bundle: the app reads window.__BOOT__ at
       mount time. The legacy page's %%API_BASE%%/%%WS_BASE%%/%%VERSION%%/
       %%SERIAL%% injections are gone (they were never even filled while the
       page was served as a static file) — REST uses the cookie session plus
       the boot token, config.ts derives the /api/help base at runtime. -->
  <script src="/api/boot.js"></script>
  <!-- legacy i18n engine: still drives the nav subtitle -->
  <script src="/app/i18n.js?v=1"></script>
  <title>PBGui — Help & Tutorials</title>
  <!-- Same local vendor markdown stack as legacy help.html:8-9 (marked GFM +
       DOMPurify sanitizer); see lib/markdown.ts for the security decision. -->
  <script src="/app/vendor/marked.min.js?v=1"></script>
  <script src="/app/vendor/purify.min.js?v=1"></script>
</head>
<body>
  <div id="app"></div>
  <!-- Shared legacy chrome, same loading order as legacy help.html:1096-1106:
       NAV_CONFIG must exist before pbgui_nav.js, which fills #topnav. The
       Guide button calls back into this page via window.PBGUI_HELP_OPENER. -->
  <script>
    window.PBGUI_NAV_CONFIG = {
      subtitle: (window.PBGuiI18n ? PBGuiI18n.t('misc.help.subtitle') : 'HELP'),
      current: 'help',
      token: (window.__BOOT__ || {}).token || '',
      apiBase: ((window.__BOOT__ || {}).origin || '') + '/api/help',
      version: (window.__BOOT__ || {}).version || '',
      serial: (window.__BOOT__ || {}).serial || ''
    };
  </script>
  <script src="/app/pbgui_nav.js"></script>
  <script type="module" src="./main.ts"></script>
</body>
</html>
