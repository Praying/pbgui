<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="/app/favicon.svg">
<!-- boot.js must run before the bundle: the app reads window.__BOOT__ at mount time -->
  <script src="/api/boot.js"></script>
  <!-- legacy i18n engine: still drives nav subtitle and shared overlays -->
  <script src="/app/i18n.js?v=1"></script>
  <title>Services - PBGui</title>
</head>
<body>
  <div id="app"></div>
  <!-- Shared legacy chrome, same loading order as frontend/services_monitor.html:
       NAV_CONFIG (token/version/serial from boot.js) must exist before pbgui_nav.js,
       which fills #topnav on DOMContentLoaded. The Vue bundle then renders the
       #page-body region around that placeholder. -->
  <script>
    window.PBGUI_NAV_CONFIG = {
      subtitle: (window.PBGuiI18n ? PBGuiI18n.t('sysmon.servicesSubtitle') : 'SERVICES'),
      current: 'system_services',
      token: (window.__BOOT__ || {}).token || '',
      version: (window.__BOOT__ || {}).version || '',
      serial: (window.__BOOT__ || {}).serial || ''
    };
  </script>
  <script src="/app/js/pbgui_dialogs.js?v=6"></script>
  <script src="/app/js/shared_help_overlay.js?v=7"></script>
  <script src="/app/pbgui_nav.js"></script>
  <script type="module" src="./main.ts"></script>
</body>
</html>
