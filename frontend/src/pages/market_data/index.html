<html lang="en">
<head>

  <meta name="description" content="PBGui market data">
    <link rel="icon" type="image/svg+xml" href="/app/favicon.svg?v=2">
<!-- boot.js must run before the bundle: the app reads window.__BOOT__ at
       mount time (services_monitor/index.html convention). The legacy page's
       %%TOKEN%% injection is gone — REST uses the cookie session and the
       notify_log relay takes its token from boot.js. -->

  <!-- legacy i18n engine remains available to shared overlays -->
  <script src="/app/i18n.js?v=1"></script>
  <title>Market Data - PBGui</title>
  <!-- Vendor global, same file as market_data_main.html:3661 — loaded
       externally, not bundled (dashboard_editor R2 decision; only the
       inventory heatmaps of M-data-6 need it). -->
  <script src="/app/plotly.min.js?v=1"></script>
</head>
<body>
  <div id="app"></div>
  <!-- Shared help and activity-panel bridges remain local/offline assets. -->
  <script src="/app/js/shared_help_overlay.js?v=8"></script>
  <script src="/app/js/log_viewer_panel.js?v=30"></script>
  <script type="module" src="./main.ts"></script>
</body>
</html>
