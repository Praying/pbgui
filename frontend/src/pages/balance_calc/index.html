<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="icon" type="image/svg+xml" href="/app/favicon.svg?v=2">
<!-- boot.js must run before the bundle: the app reads window.__BOOT__ at
       mount time. The legacy page's %%API_BASE%%/%%INSTANCE%%/%%DRAFT_ID%%/
       %%INIT_EXCHANGE%%/%%EXCHANGES%% injections are gone — config.ts derives
       the base from boot.js and the pre-selections from the URL query the
       route already passes through verbatim. -->
  <script src="/api/boot.js"></script>
  <!-- legacy i18n engine remains available to shared scripts -->
  <script src="/app/i18n.js?v=1"></script>
  <title>Balance Calculator</title>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
