<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <link rel="icon" type="image/svg+xml" href="/app/favicon.svg">
<script src="/app/i18n.js?v=1"></script>
    <title>Job Monitor - PBGui</title>
    <link rel="stylesheet" href="/app/css/app.css?v=4">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif; }
        /* Additional styles for new features */
        .job-actions {
            display: flex;
            flex-wrap: wrap;
            gap: var(--sp-xs);
            align-items: center;
        }
        .job-actions button { margin-left: 0; }
        .btn-secondary { background: var(--bg-elevated); border: 1px solid var(--border-default); color: var(--text-primary); }
        .btn-secondary:hover { border-color: var(--border-strong); background: var(--border-default); }
        .btn-view { background: var(--accent-deep); color: var(--accent-contrast); }
        .btn-view:hover { background: var(--accent); }
        .btn-run { background: var(--success); color: var(--accent-contrast); }
        .btn-run:hover { background: var(--success); color: var(--accent-contrast); }
        .btn-info { background: var(--accent-deep); color: var(--accent-contrast); }
        .btn-info:hover { background: var(--accent); }
        
        /* Log Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            inset: 0;
            width: 100%;
            height: 100%;
            padding-top: calc(var(--modal-visible-top-offset, 0px) + var(--sp-lg, 20px));
            padding-right: var(--sp-lg, 20px);
            padding-bottom: calc(var(--modal-visible-bottom-offset, 0px) + var(--sp-lg, 20px));
            padding-left: var(--sp-lg, 20px);
            overflow-y: auto;
            background-color: var(--bg-backdrop);
        }
        .modal.active { display: flex; align-items: center; justify-content: center; }
        .modal-content {
            background: var(--bg-card);
            border: 1px solid var(--border-default);
            box-shadow: var(--shadow-modal);
            border-radius: 8px;
            padding: 1.5rem;
            width: min(900px, calc(100vw - (var(--sp-lg) * 2)));
            max-width: 900px;
            max-height: calc(var(--modal-visible-height, 100vh) - (var(--sp-lg, 20px) * 2));
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            border-bottom: 1px solid var(--border-default);
            padding-bottom: 0.75rem;
        }
        .modal-body {
            overflow-y: auto;
            flex: 1;
            background: var(--bg-page);
            padding: 1rem;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: var(--fs-sm);
        }
        .job-details-modal-body {
            background: var(--bg-page);
            padding: var(--sp-md);
            font-family: inherit;
            font-size: var(--fs-base);
            color: var(--text-primary);
            display: grid;
            gap: var(--sp-md);
        }
        .details-section {
            background: var(--surface-sidebar);
            border: 1px solid var(--border-subtle);
            border-radius: 6px;
            padding: var(--sp-md);
            display: grid;
            gap: var(--sp-sm);
        }
        .details-section h3 {
            margin: 0;
            font-size: var(--fs-md);
            color: var(--text-primary);
        }
        .details-kv {
            display: grid;
            grid-template-columns: minmax(120px, max-content) 1fr;
            gap: var(--sp-xs) var(--sp-sm);
            align-items: start;
            font-size: var(--fs-sm);
        }
        .details-kv-key {
            color: var(--text-secondary);
            font-weight: 600;
        }
        .details-kv-value {
            color: var(--text-primary);
            min-width: 0;
            word-break: break-word;
        }
        .details-empty {
            color: var(--text-secondary);
            font-size: var(--fs-sm);
        }
        .json-block {
            margin: 0;
            padding: var(--sp-md);
            border-radius: 4px;
            background: var(--bg-input);
            border: 1px solid var(--border-default);
            color: var(--text-primary);
            font-family: 'Courier New', monospace;
            font-size: var(--fs-sm);
            white-space: pre-wrap;
            word-break: break-word;
            overflow-x: auto;
        }
        .log-line {
            margin: 0.25rem 0;
            color: var(--text-primary);
            white-space: pre-wrap;
            word-break: break-all;
        }
        .close-btn {
            background: var(--danger-deep);
            color: var(--text-primary);
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: var(--fs-base);
        }
        .close-btn:hover { background: var(--danger); color: var(--accent-contrast); }
        
        /* Progress details */
        .progress-details {
            font-size: var(--fs-xs);
            color: var(--text-secondary);
            margin-top: 0.5rem;
        }
        .progress-details .detail { margin-right: 1rem; }
        
        /* Job expander */
        .job-expander {
            margin-top: 0.5rem;
            border-top: 1px solid var(--border-default);
            padding-top: 0.5rem;
        }
        .expander-toggle {
            background: transparent;
            border: none;
            color: var(--accent);
            cursor: pointer;
            font-size: var(--fs-sm);
            padding: 0.25rem 0;
        }
        .expander-toggle:hover { text-decoration: underline; }
        .expander-content {
            display: none;
            padding: 0.75rem;
            background: var(--bg-input);
            border-radius: 4px;
            margin-top: 0.5rem;
            font-size: var(--fs-sm);
        }
        .expander-content.open { display: block; }
        .detail-row { margin: 0.3rem 0; }
        .downloader-details {
            margin-top: 0.75rem;
            border: 1px solid rgb(var(--accent-rgb) / 0.22);
            border-radius: 10px;
            background: linear-gradient(135deg, rgb(var(--bg-page-rgb) / 0.96), var(--bg-panel));
            overflow: hidden;
        }
        .downloader-details summary {
            cursor: pointer;
            list-style: none;
            padding: 0.75rem 0.9rem;
            color: var(--accent-soft);
            font-weight: 700;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.8rem;
        }
        .downloader-details summary::-webkit-details-marker { display: none; }
        .downloader-details summary::before {
            content: '▶';
            color: var(--accent);
            margin-right: 0.2rem;
        }
        .downloader-details[open] summary::before { content: '▼'; }
        .downloader-total {
            color: var(--accent-soft);
            font-size: var(--fs-xs);
            font-weight: 600;
            white-space: nowrap;
        }
        .downloader-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 0.75rem;
            padding: 0 0.9rem 0.9rem;
        }
        .downloader-card {
            border: 1px solid rgb(var(--text-secondary-rgb) / 0.16);
            border-radius: 9px;
            background: var(--bg-input);
            padding: 0.75rem;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.03);
        }
        .downloader-card-head {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 0.75rem;
            margin-bottom: 0.55rem;
        }
        .downloader-name {
            color: var(--text-primary);
            font-weight: 700;
            line-height: 1.25;
            word-break: break-word;
        }
        .downloader-badge {
            border: 1px solid rgb(var(--accent-rgb) / 0.28);
            border-radius: 999px;
            color: var(--accent-soft);
            background: rgb(var(--accent-rgb) / 0.1);
            padding: 0.12rem 0.45rem;
            font-size: var(--fs-xs);
            text-transform: uppercase;
            white-space: nowrap;
        }
        .downloader-badge.waiting {
            border-color: rgb(var(--text-secondary-rgb) / 0.22);
            color: var(--text-secondary);
            background: rgb(var(--text-secondary-rgb) / 0.08);
        }
        .downloader-badge.failed {
            border-color: rgb(var(--danger-rgb) / 0.35);
            color: var(--danger-soft);
            background: rgb(var(--danger-rgb) / 0.12);
        }
        .downloader-badge.done {
            border-color: rgb(var(--success-rgb) / 0.32);
            color: var(--success-soft);
            background: rgb(var(--success-rgb) / 0.1);
        }
        .downloader-meter {
            height: 7px;
            border-radius: 999px;
            overflow: hidden;
            background: var(--border-subtle);
            margin-bottom: 0.6rem;
        }
        .downloader-meter-fill {
            height: 100%;
            border-radius: inherit;
            background: linear-gradient(90deg, var(--accent-deep), var(--success));
            min-width: 2px;
        }
        .downloader-meter-fill.empty {
            width: 100%;
            min-width: 0;
            background: repeating-linear-gradient(90deg, rgb(var(--text-secondary-rgb) / 0.22), rgb(var(--text-secondary-rgb) / 0.22) 8px, rgb(var(--text-secondary-rgb) / 0.08) 8px, rgb(var(--text-secondary-rgb) / 0.08) 16px);
        }
        .downloader-stats {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 0.45rem 0.65rem;
            font-size: var(--fs-xs);
        }
        .downloader-stat-label { color: var(--text-secondary); display: block; }
        .downloader-stat-value { color: var(--text-primary); font-weight: 700; }
        .downloader-current {
            grid-column: 1 / -1;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        /* Tab header actions */
        .tab-header-actions {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 1rem;
            padding: 0.5rem;
            border-bottom: 1px solid var(--border-default);
        }
        .tab-header-actions button {
            background: var(--danger-deep);
            color: var(--text-primary);
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: var(--fs-sm);
        }
        .tab-header-actions button:hover { background: var(--danger); color: var(--accent-contrast); }
        .tab-header-actions button:disabled {
            background: var(--text-disabled);
            cursor: not-allowed;
            opacity: 0.5;
        }

        /* Action dialog */
        .action-modal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 1100;
            background: var(--bg-backdrop);
            align-items: center;
            justify-content: center;
            padding: var(--sp-lg);
        }
        .action-modal.active { display: flex; }
        .action-modal-card {
            width: min(460px, 92vw);
            background: var(--bg-panel);
            border: 1px solid var(--border-default);
            border-radius: 12px;
            box-shadow: var(--shadow-modal);
            overflow: hidden;
        }
        .action-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: var(--sp-sm);
            padding: 0.85rem 1.1rem;
            border-bottom: 1px solid var(--border-subtle);
            background: var(--surface-sidebar);
        }
        .action-modal-title {
            font-size: var(--fs-md);
            font-weight: 700;
            color: var(--text-primary);
        }
        .action-modal-close {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: var(--fs-lg);
            cursor: pointer;
            padding: 0.2rem 0.35rem;
            border-radius: 5px;
            line-height: 1;
        }
        .action-modal-close:hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.06);
        }
        .action-modal-body {
            display: grid;
            gap: var(--sp-md);
            padding: var(--sp-lg);
        }
        .action-modal-message {
            font-size: var(--fs-base);
            color: var(--text-primary);
            line-height: 1.5;
        }
        .action-modal-detail {
            font-size: var(--fs-sm);
            color: var(--text-secondary);
            line-height: 1.45;
        }
        .action-modal-detail[hidden] { display: none !important; }
        .action-modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: var(--sp-sm);
            flex-wrap: wrap;
        }
        .action-modal-actions .btn {
            min-width: 96px;
        }
        .action-modal-cancel[hidden] { display: none !important; }

        html.is-embedded,
        body.is-embedded {
            padding: 0;
            background: var(--bg-page);
            color: var(--text-primary);
            overflow: hidden;
        }
        body.is-embedded .container {
            max-width: none;
            overflow: hidden;
        }
        body.is-embedded header {
            justify-content: flex-end;
            margin-bottom: var(--sp-sm);
            padding-bottom: 0;
            border-bottom: 0;
        }
        body.is-embedded header h1 {
            display: none;
        }
        body.is-embedded .tabs {
            margin-bottom: var(--sp-sm);
        }
        body.is-embedded .tab-header-actions {
            padding: 0 0 var(--sp-sm);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1 data-i18n="sysmon.jobMonitor">Job Monitor</h1>
            <div class="status">
                <span id="connection-status" class="badge badge-connecting" data-i18n="sysmon.connecting">Connecting...</span>
                <span id="worker-status" class="badge badge-unknown" data-i18n="sysmon.workerUnknown">Worker: Unknown</span>
            </div>
        </header>

        <div class="tabs">
            <button class="tab-btn active" data-tab="running" data-i18n="sysmon.active">Active</button>
            <button class="tab-btn" data-tab="done" data-i18n="sysmon.done">Done</button>
            <button class="tab-btn" data-tab="failed" data-i18n="sysmon.failedTab">Failed</button>
        </div>

        <div class="tab-content active" id="tab-running">
            <div id="jobs-running" class="jobs-list">
                <p class="loading" data-i18n="common.loading">Loading...</p>
            </div>
        </div>

        <div class="tab-content" id="tab-done">
            <div class="tab-header-actions">
                <button onclick="deleteAllJobs('done')" id="delete-all-done-btn" data-i18n="sysmon.deleteAllDoneJobs">Delete All Done Jobs</button>
            </div>
            <div id="jobs-done" class="jobs-list">
                <p class="loading" data-i18n="common.loading">Loading...</p>
            </div>
        </div>

        <div class="tab-content" id="tab-failed">
            <div class="tab-header-actions">
                <button onclick="deleteAllJobs('failed')" id="delete-all-failed-btn" data-i18n="sysmon.deleteAllFailedJobs">Delete All Failed Jobs</button>
            </div>
            <div id="jobs-failed" class="jobs-list">
                <p class="loading" data-i18n="common.loading">Loading...</p>
            </div>
        </div>
    </div>

    <!-- Log Modal -->
    <div id="log-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2><span data-i18n="sysmon.jobLog">Job Log:</span> <span id="log-job-id"></span></h2>
                <button class="close-btn" onclick="closeLogModal()" data-i18n="common.close">Close</button>
            </div>
            <div class="modal-body" id="log-content">
                <p data-i18n="common.loading">Loading...</p>
            </div>
        </div>
    </div>

    <div id="details-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2><span data-i18n="sysmon.jobDetails">Job Details:</span> <span id="details-job-id"></span></h2>
                <button class="close-btn" onclick="closeDetailsModal()" data-i18n="common.close">Close</button>
            </div>
            <div class="modal-body job-details-modal-body" id="details-content">
                <p data-i18n="common.loading">Loading...</p>
            </div>
        </div>
    </div>

    <div id="action-modal" class="action-modal" aria-hidden="true">
        <div class="action-modal-card" role="dialog" aria-modal="true" aria-labelledby="action-modal-title">
            <div class="action-modal-header">
                <div class="action-modal-title" id="action-modal-title" data-i18n="common.confirmAction">Confirm action</div>
                <button class="action-modal-close" id="action-modal-close" type="button">&#x2715;</button>
            </div>
            <div class="action-modal-body">
                <div class="action-modal-message" id="action-modal-message"></div>
                <div class="action-modal-detail" id="action-modal-detail" hidden></div>
                <div class="action-modal-actions">
                    <button class="btn btn-secondary action-modal-cancel" id="action-modal-cancel" type="button" data-i18n="common.cancel">Cancel</button>
                    <button class="btn btn-info" id="action-modal-accept" type="button" data-i18n="common.confirm">Confirm</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin + '/api';
        document.title = PBGuiI18n.t('sysmon.jobMonitorTitle');
        
        // Browser authentication is carried by the same-origin session cookie.
        const urlParams = new URLSearchParams(window.location.search);
        const EMBED_MODE = urlParams.get('embed') === '1';
        const EXCHANGE_FILTER = (urlParams.get('exchange') || '').trim().toLowerCase();
        const JOB_TYPE_FILTER = (urlParams.get('job_type') || '').trim().toLowerCase();

        function authOptions(options = {}) {
            return {
                ...options,
                headers: {
                    ...(options.headers || {})
                }
            };
        }

        if (EMBED_MODE) {
            document.documentElement.classList.add('is-embedded');
            document.body.classList.add('is-embedded');
        }

        function isClippingAncestor(element, view) {
            if (!element || !view || typeof view.getComputedStyle !== 'function') {
                return false;
            }
            const style = view.getComputedStyle(element);
            if (!style) {
                return false;
            }
            const overflowValue = `${String(style.overflow || '')} ${String(style.overflowY || '')} ${String(style.overflowX || '')}`;
            return /(auto|scroll|hidden|clip|overlay)/i.test(overflowValue);
        }

        function resolveModalViewportMetrics() {
            const fallbackHeight = Math.max(0, window.innerHeight || 0);
            let topViewportHeight = fallbackHeight;
            try {
                if (window.top && window.top.innerHeight) {
                    topViewportHeight = Math.max(0, window.top.innerHeight || 0);
                }
            } catch (_) {
                topViewportHeight = fallbackHeight;
            }

            const fallback = {
                visibleHeight: topViewportHeight || fallbackHeight,
                topOffset: 0,
                bottomOffset: 0,
            };

            try {
                const frame = window.frameElement;
                if (!frame || !window.top || window.top === window) {
                    return fallback;
                }
                const ownerDoc = frame.ownerDocument || (window.top && window.top.document) || null;
                const ownerView = (ownerDoc && ownerDoc.defaultView) || window.top;
                const rect = frame.getBoundingClientRect();
                let clipTop = 0;
                let clipBottom = topViewportHeight;
                let ancestor = frame.parentElement;
                while (ancestor) {
                    if (isClippingAncestor(ancestor, ownerView)) {
                        const ancestorRect = ancestor.getBoundingClientRect();
                        clipTop = Math.max(clipTop, ancestorRect.top);
                        clipBottom = Math.min(clipBottom, ancestorRect.bottom);
                    }
                    ancestor = ancestor.parentElement;
                }
                const visibleTop = Math.max(rect.top, clipTop);
                const visibleBottom = Math.min(rect.bottom, clipBottom);
                const visibleHeight = Math.max(0, visibleBottom - visibleTop);
                return {
                    visibleHeight: visibleHeight || fallback.visibleHeight,
                    topOffset: Math.max(0, visibleTop - rect.top),
                    bottomOffset: Math.max(0, rect.bottom - visibleBottom),
                };
            } catch (_) {
                return fallback;
            }
        }

        function updateModalViewportHeight() {
            const metrics = resolveModalViewportMetrics();
            document.documentElement.style.setProperty('--modal-visible-height', `${Math.max(0, metrics.visibleHeight)}px`);
            document.documentElement.style.setProperty('--modal-visible-top-offset', `${Math.max(0, metrics.topOffset)}px`);
            document.documentElement.style.setProperty('--modal-visible-bottom-offset', `${Math.max(0, metrics.bottomOffset)}px`);
        }

        updateModalViewportHeight();
        window.addEventListener('resize', updateModalViewportHeight);
        window.addEventListener('scroll', updateModalViewportHeight, { passive: true });
        try {
            const parentDoc = window.frameElement && window.frameElement.ownerDocument;
            if (parentDoc) {
                parentDoc.addEventListener('scroll', updateModalViewportHeight, { passive: true, capture: true });
            }
            if (window.top && window.top !== window) {
                window.top.addEventListener('resize', updateModalViewportHeight);
                window.top.addEventListener('scroll', updateModalViewportHeight, { passive: true });
                if (window.top.document && window.top.document !== parentDoc) {
                    window.top.document.addEventListener('scroll', updateModalViewportHeight, { passive: true, capture: true });
                }
            }
        } catch (_) {
            void _;
        }
        
        const wsProto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const WS_URL = `${wsProto}//${window.location.host}/ws/jobs`;
        
        let ws = null;
        let currentTab = 'running';
        let reconnectAttempts = 0;
        const MAX_RECONNECT_ATTEMPTS = 5;
        let expandedJobs = new Set();
        let expandedDownloaderJobs = new Set();
        let activeJobsSnapshot = [];
        const downloaderLogCache = new Map();
        const downloaderLogFetches = new Set();
        let actionDialogResolve = null;
        let actionDialogReturnFocus = null;

        function logUiNotification(message, type) {
            const text = String(message == null ? '' : message).trim();
            if (!text) return;
            fetch('/api/notify_log', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ msg: text, level: type || 'info' })
            }).catch(function () {});
        }

        function closeActionDialog(confirmed) {
            const modal = document.getElementById('action-modal');
            if (modal) {
                modal.classList.remove('active');
                modal.setAttribute('aria-hidden', 'true');
            }
            const resolver = actionDialogResolve;
            const returnFocus = actionDialogReturnFocus;
            actionDialogResolve = null;
            actionDialogReturnFocus = null;
            if (returnFocus && typeof returnFocus.focus === 'function') {
                try { returnFocus.focus(); } catch (_) {}
            }
            if (typeof resolver === 'function') resolver(Boolean(confirmed));
        }

        function showActionDialog(options) {
            options = options || {};
            const modal = document.getElementById('action-modal');
            const title = document.getElementById('action-modal-title');
            const message = document.getElementById('action-modal-message');
            const detail = document.getElementById('action-modal-detail');
            const cancelBtn = document.getElementById('action-modal-cancel');
            const acceptBtn = document.getElementById('action-modal-accept');

            if (!modal || !title || !message || !detail || !cancelBtn || !acceptBtn) {
                return Promise.resolve(options.cancelText === null || options.cancelText === '');
            }

            if (typeof actionDialogResolve === 'function') {
                const previousResolve = actionDialogResolve;
                actionDialogResolve = null;
                previousResolve(false);
            }

            title.textContent = String(options.title || PBGuiI18n.t('common.confirmAction'));
            message.textContent = String(options.message || PBGuiI18n.t('common.areYouSure'));
            const detailText = String(options.detail || '').trim();
            detail.textContent = detailText;
            detail.hidden = !detailText;

            const cancelText = options.cancelText;
            if (cancelText === null || cancelText === '') {
                cancelBtn.hidden = true;
            } else {
                cancelBtn.hidden = false;
                cancelBtn.textContent = String(cancelText || PBGuiI18n.t('common.cancel'));
            }
            acceptBtn.textContent = String(options.confirmText || PBGuiI18n.t('common.confirm'));
            acceptBtn.className = 'btn ' + (options.confirmClass || 'btn-info');
            actionDialogReturnFocus = document.activeElement;

            return new Promise((resolve) => {
                actionDialogResolve = resolve;
                updateModalViewportHeight();
                modal.classList.add('active');
                modal.setAttribute('aria-hidden', 'false');
                acceptBtn.focus();
            });
        }

        async function showActionNotice(options) {
            const noticeTitle = options && options.title ? String(options.title) : PBGuiI18n.t('sysmon.notice');
            const noticeMessage = options && options.message ? String(options.message) : '';
            logUiNotification(noticeMessage ? noticeTitle + ': ' + noticeMessage : noticeTitle, options && options.level ? options.level : 'info');
            await showActionDialog({
                title: noticeTitle,
                message: noticeMessage,
                detail: options && options.detail ? options.detail : '',
                confirmText: options && options.confirmText ? options.confirmText : PBGuiI18n.t('common.ok'),
                confirmClass: options && options.confirmClass ? options.confirmClass : 'btn-info',
                cancelText: null
            });
        }

            updateModalViewportHeight();
        // ── Job Filter ──
        function matchesExchangeFilter(job) {
            // No filter = show all jobs
            if (!EXCHANGE_FILTER && !JOB_TYPE_FILTER) return true;

            // Job type filter (comma-separated list)
            if (JOB_TYPE_FILTER) {
                const allowedTypes = JOB_TYPE_FILTER.split(',').map(t => t.trim());
                const jt = (job.type || '').toLowerCase();
                if (!allowedTypes.some(t => jt === t)) return false;
            }
            
                        updateModalViewportHeight();
            // Try explicit exchange field first
            let jobExchange = (job.exchange || '').trim().toLowerCase();
            
            // Fallback: derive exchange from job_type for legacy jobs
            if (!jobExchange && job.type) {
                const jobType = job.type.toLowerCase();
                if (jobType.startsWith('hl_') || jobType.includes('hyperliquid')) {
                    jobExchange = 'hyperliquid';
                } else if (jobType.startsWith('binance_') || jobType.includes('binance')) {
                    jobExchange = 'binanceusdm';
                } else if (jobType.startsWith('bybit_') || jobType.includes('bybit')) {
                    jobExchange = 'bybit';
                } else if (jobType.startsWith('bitget_') || jobType.includes('bitget')) {
                    jobExchange = 'bitget';
                }
            }
            
            // If still no exchange detected, show on all tabs (unknown job type)
            if (!jobExchange) return true;
            
            // Match against detected exchange
            return jobExchange === EXCHANGE_FILTER;
        }

        // ── WebSocket Connection ──
        function connectWebSocket() {
            const statusEl = document.getElementById('connection-status');
            statusEl.textContent = PBGuiI18n.t('sysmon.connecting');
            statusEl.className = 'badge badge-connecting';

            ws = new WebSocket(WS_URL);

            ws.onopen = () => {
                console.log('WebSocket connected');
                statusEl.textContent = PBGuiI18n.t('sysmon.connected');
                statusEl.className = 'badge badge-connected';
                reconnectAttempts = 0;
            };

            ws.onmessage = (event) => {
                try {
                    const msg = JSON.parse(event.data);
                    if (msg.type === 'jobs') {
                        updateJobs(msg.data);
                    }
                } catch (e) {
                    console.error('WebSocket message error:', e);
                }
            };

            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
                statusEl.textContent = PBGuiI18n.t('common.error');
                statusEl.className = 'badge badge-error';
            };

            ws.onclose = () => {
                console.log('WebSocket closed');
                statusEl.textContent = PBGuiI18n.t('sysmon.disconnected');
                statusEl.className = 'badge badge-error';
                
                // Try to reconnect
                if (reconnectAttempts < MAX_RECONNECT_ATTEMPTS) {
                    reconnectAttempts++;
                    console.log(`Reconnecting... (attempt ${reconnectAttempts})`);
                    setTimeout(connectWebSocket, 3000);
                } else {
                    console.log('Max reconnection attempts reached, falling back to polling');
                    startPolling();
                }
            };
        }

        // ── Polling Fallback ──
        let pollingInterval = null;
        function startPolling() {
            if (pollingInterval) return;
            
            const statusEl = document.getElementById('connection-status');
            statusEl.textContent = PBGuiI18n.t('sysmon.polling');
            statusEl.className = 'badge badge-connecting';

            pollingInterval = setInterval(async () => {
                try {
                    const resp = await fetch(`${API_BASE}/jobs/?states=pending,running`, authOptions());
                    const data = await resp.json();
                    updateJobs(data.jobs);
                } catch (e) {
                    console.error('Polling error:', e);
                }
            }, 2000);
        }

        // ── Update Jobs Display ──
        function updateJobs(jobs) {
            const runningContainer = document.getElementById('jobs-running');
            
            // Apply exchange filter
            const filteredJobs = jobs.filter(matchesExchangeFilter);
            const activeJobs = filteredJobs.filter(j => ['pending', 'running'].includes(j.status));

            if (!activeJobs || activeJobs.length === 0) {
                runningContainer.innerHTML = '<p class="no-jobs">No active jobs.</p>';
                return;
            }

            // Keep active jobs stable: running first, then queue/start order.
            activeJobs.sort(compareActiveJobs);
            activeJobsSnapshot = activeJobs;

            runningContainer.innerHTML = activeJobs.map(renderActiveJob).join('');
            ensureDownloaderLogFallbacks(activeJobs);
        }

        // ── Render Active Job (with details) ──
        function renderActiveJob(job) {

        // ── Render Job for Done/Failed tabs ──
        function renderJob(job) {

            const progress = job.progress || {};
            const lr = progress.last_result || {};

                ? coins.join(', ')
                : coins.slice(0, 8).join(', ') + ` … (${coins.length} total)`;

            const startDay = payload.start_day || '';
            const endDay = payload.end_day || '';
            const rangeStr = (startDay || endDay)
                ? `${fmtDayCompact(startDay)} → ${fmtDayCompact(endDay)}`
                : '';

            // Stats
            const downloaded = progress.downloaded_total || lr.downloaded || 0;
            const skipped = progress.skipped_existing_total || lr.skipped_existing || 0;

                        </div>
                        <div class="job-actions">
                            <button class="btn btn-view" data-job-action="view" data-job-id="${jobIdAttr}">${PBGuiI18n.t('sysmon.view')}</button>
                            <button class="btn btn-info" data-job-action="log" data-job-id="${jobIdAttr}">${PBGuiI18n.t('sysmon.log')}</button>
                            ${isFailed ? `<button class="btn btn-secondary" data-job-action="retry" data-job-id="${jobIdAttr}">${PBGuiI18n.t('sysmon.retry')}</button>` : ''}
                            ${isDone ? `<button class="btn btn-secondary" data-job-action="requeue" data-job-id="${jobIdAttr}">${PBGuiI18n.t('sysmon.requeue')}</button>` : ''}

                    </div>
                    <div class="job-details">
                        <span class="detail">${escapeHtml(formatTimestamp(job.updated_ts))}</span>
                        ${rangeStr ? `<span class="detail" style="margin-left:0.8rem;">${PBGuiI18n.t('sysmon.range', {v: escapeHtml(rangeStr)})}</span>` : ''}
                    </div>
                    ${job.error ? `<div class="job-error" style="margin-top:0.5rem;color:var(--danger);font-size:var(--fs-sm);">${escapeHtml(job.error)}</div>` : ''}
                    ${(hasStats || coinPreview) ? `
                        <div class="job-expander">
                            <button class="expander-toggle" data-job-action="toggle" data-job-id="${jobIdAttr}">
                                ${isExpanded ? '▼' : '▶'} ${PBGuiI18n.t('sysmon.details')}
                            </button>
                            <div class="expander-content ${isExpanded ? 'open' : ''}" data-expander-job-id="${jobIdAttr}">
                                ${coinPreview ? `<div class="detail-row"><strong>${PBGuiI18n.t('sysmon.coinsLabel')}</strong> ${escapeHtml(coinPreview)}</div>` : ''}
                                ${payload.only_missing_1m_src_hours !== undefined ? `<div class="detail-row"><strong>${PBGuiI18n.t('sysmon.onlyMissing1mSrcHours')}</strong> ${payload.only_missing_1m_src_hours ? PBGuiI18n.t('common.yes') : PBGuiI18n.t('common.no')}</div>` : ''}
                                ${hasStats ? `
                                    <div class="detail-row"><strong>${PBGuiI18n.t('sysmon.downloadsLabel')}</strong> ${escapeHtml(String(downloaded))} ${PBGuiI18n.t('sysmon.files', {n: escapeHtml(dlBytes)})}</div>
                                    <div class="detail-row"><strong>${PBGuiI18n.t('sysmon.skippedLabel')}</strong> ${escapeHtml(String(skipped))} ${PBGuiI18n.t('sysmon.files', {n: escapeHtml(skBytes)})}</div>
                                    <div class="detail-row"><strong>${PBGuiI18n.t('sysmon.failedLabel')}</strong> ${escapeHtml(String(failed))} ${PBGuiI18n.t('sysmon.files', {n: escapeHtml(flBytes)})}</div>
                                ` : ''}
                            </div>
                        </div>
                    ` : ''}
                    ${downloaderDetails}
                </div>
            `;
        }

        function fmtDayCompact(yyyymmdd) {
            if (!yyyymmdd || yyyymmdd.length !== 8) return yyyymmdd || '?';
            return yyyymmdd.slice(0,4) + '-' + yyyymmdd.slice(4,6) + '-' + yyyymmdd.slice(6,8);
        }

        function formatJobDuration(job) {
            const progress = job.progress || {};
            const lr = progress.last_result || {};
            const recordedDuration = parseFloat(lr.duration_s || 0);
            if (['done', 'failed'].includes(job.status) && recordedDuration > 0) {
                return formatDurationSeconds(Math.round(recordedDuration));
            }
            const createdTs = parseFloat(job.created_ts || 0);
            const runStartedTs = parseFloat(job.run_started_ts || 0);
            const finishedTs = parseFloat(job.finished_ts || 0);
            const updatedTs = parseFloat(job.updated_ts || 0);
            const startTs = runStartedTs > 0 ? runStartedTs : createdTs;
            let endTs = updatedTs;
            if (finishedTs > 0) {
                endTs = finishedTs;
            } else if (job.status === 'running' && runStartedTs > 0) {
                endTs = Date.now() / 1000;
            }
            if (!(startTs > 0) || endTs < startTs) return '';
            return formatDurationSeconds(Math.round(endTs - startTs));
        }

        function formatDurationSeconds(dur) {
            const h = Math.floor(dur / 3600);
            const m = Math.floor((dur % 3600) / 60);
            const s = dur % 60;
            if (h > 0) return `${h}h ${String(m).padStart(2,'0')}m ${String(s).padStart(2,'0')}s`;
            if (m > 0) return `${m}m ${String(s).padStart(2,'0')}s`;
            return `${s}s`;
        }

        // ── Helper Functions ──
        function calculateProgress(pr) {
            if (!pr.total) return 0;
            const step = pr.step || 0;
            const chunkDone = pr.chunk_done || 0;
            const chunkTotal = pr.chunk_total || 1;
            const frac = chunkTotal > 0 ? chunkDone / chunkTotal : 0;
            const pct = ((step - 1 + frac) / pr.total) * 100;
            return Math.min(100, Math.max(0, Math.round(pct)));
        }

        function formatBytes(bytes) {
            if (!bytes) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return (bytes / Math.pow(k, i)).toFixed(2) + ' ' + sizes[i];
        }

        function numberValue(value) {
            const n = Number(value || 0);
            return Number.isFinite(n) ? n : 0;
        }

        function formatCount(value) {
            return Math.round(numberValue(value)).toLocaleString();
        }

        function formatDaysFromMinutes(value) {
            const days = numberValue(value) / 1440;
            if (days >= 100) return Math.round(days).toLocaleString();
            if (days >= 10) return days.toFixed(1);
            return days.toFixed(2);
        }

        function parseHumanBytes(value) {
            const text = String(value || '').trim();
            const match = text.match(/^(\d+(?:\.\d+)?)\s*(B|KiB|MiB|GiB|TiB|KB|MB|GB|TB)$/i);
            if (!match) return 0;
            const amount = Number(match[1] || 0);
            if (!Number.isFinite(amount)) return 0;
            const unit = String(match[2] || 'B').toUpperCase();
            const powers = { B: 0, KIB: 1, KB: 1, MIB: 2, MB: 2, GIB: 3, GB: 3, TIB: 4, TB: 4 };
            return Math.round(amount * Math.pow(1024, powers[unit] || 0));
        }

        function parseDownloaderRowsFromLog(logLines) {
            const stats = new Map();
            const active = new Map();
            (Array.isArray(logLines) ? logLines : []).forEach(line => {
                const text = String(line || '');
                const startMatch = text.match(/^\S+\s+\S+\s+(.+?)\s+segment\s+coin=(\S+)\s+symbol=\S+\s+range=(\S+)/);
                if (startMatch) {
                    active.set(startMatch[1].trim(), { coin: startMatch[2], range: startMatch[3] });
                    return;
                }
                const match = text.match(/^\S+\s+\S+\s+(.+?)\s+segment done\s+coin=\S+\s+pages=(\d+)\s+rows=(\d+)(?:\s+payload=([^\s]+(?:\s+[A-Za-z]+)?))?.*?minutes_written=(\d+)/);
                if (!match) return;
                const host = match[1].trim();
                active.delete(host);
                const current = stats.get(host) || {
                    host: host,
                    mode: '',
                    status: 'from log',
                    segments: 0,
                    pages: 0,
                    rows: 0,
                    payloadBytes: 0,
                    minutesWritten: 0,
                    currentCoin: '',
                    currentRange: ''
                };
                current.segments += 1;
                current.pages += numberValue(match[2]);
                current.rows += numberValue(match[3]);
                current.payloadBytes += parseHumanBytes(match[4]);
                current.minutesWritten += numberValue(match[5]);
                stats.set(host, current);
            });
            active.forEach((currentWork, host) => {
                const current = stats.get(host) || {
                    host: host,
                    mode: '',
                    status: 'running',
                    segments: 0,
                    pages: 0,
                    rows: 0,
                    payloadBytes: 0,
                    minutesWritten: 0,
                    currentCoin: '',
                    currentRange: ''
                };
                current.currentCoin = currentWork.coin || '';
                current.currentRange = currentWork.range || '';
                current.status = current.status === 'from log' ? 'running' : current.status;
                stats.set(host, current);
            });
            return Array.from(stats.values());
        }

        function getDownloaderRows(job, logLines) {
            const payload = job && job.payload && typeof job.payload === 'object' ? job.payload : {};
            const progress = job && job.progress && typeof job.progress === 'object' ? job.progress : {};
            const lastResult = progress.last_result && typeof progress.last_result === 'object' ? progress.last_result : {};
            const rawRows = Array.isArray(lastResult.host_results) && lastResult.host_results.length
                ? lastResult.host_results
                : (Array.isArray(lastResult.downloaders) ? lastResult.downloaders : []);
            const byHost = new Map();
            const sourceRows = rawRows.length ? rawRows : parseDownloaderRowsFromLog(logLines);
            sourceRows.forEach(row => {
                const coins = Array.isArray(row.coins) ? row.coins : [];
                const currentCoin = String(row.current_coin !== undefined ? row.current_coin : (row.currentCoin || '')).trim();
                const currentRange = String(row.current_range !== undefined ? row.current_range : (row.currentRange || '')).trim();
                const host = String(row.host || row.hostname || 'Downloader');
                byHost.set(host, {
                    host: String(row.host || row.hostname || 'Downloader'),
                    mode: String(row.mode || '').toUpperCase(),
                    status: String(row.status || ''),
                    segments: numberValue(row.segments),
                    pages: numberValue(row.pages),
                    rows: numberValue(row.rows),
                    payloadBytes: numberValue(row.payload_bytes !== undefined ? row.payload_bytes : row.payloadBytes),
                    minutesWritten: numberValue(row.minutes_written !== undefined ? row.minutes_written : row.minutesWritten),
                    coins: coins.map(item => String(item)).filter(Boolean),
                    currentCoin: currentCoin,
                    currentRange: currentRange
                });
            });
            if (Array.isArray(payload.distributed_hosts)) {
                payload.distributed_hosts.forEach(hostInfo => {
                    if (!hostInfo || typeof hostInfo !== 'object') return;
                    const label = String(hostInfo.label || hostInfo.hostname || hostInfo.target || '').trim();
                    if (!label || byHost.has(label)) return;
                    byHost.set(label, {
                        host: label,
                        mode: String(hostInfo.mode || '').toUpperCase(),
                        status: 'waiting',
                        segments: 0,
                        pages: 0,
                        rows: 0,
                        payloadBytes: 0,
                        minutesWritten: 0,
                        coins: [],
                        currentCoin: '',
                        currentRange: ''
                    });
                });
            }
            return Array.from(byHost.values()).filter(row => row.host);
        }

        function renderDownloaderDetails(job, opts) {
            const options = opts || {};
            const rows = getDownloaderRows(job, options.logLines || []);
            if (!rows.length) return '';
            const totalPayload = rows.reduce((sum, row) => sum + row.payloadBytes, 0);
            const totalRows = rows.reduce((sum, row) => sum + row.rows, 0);
            const totalPages = rows.reduce((sum, row) => sum + row.pages, 0);
            const totalSegments = rows.reduce((sum, row) => sum + row.segments, 0);
            const contributionScore = row => {
                if (totalPayload > 0) return row.payloadBytes;
                if (totalRows > 0) return row.rows;
                if (totalPages > 0) return row.pages;
                return row.segments;
            };
            const maxContribution = Math.max(1, ...rows.map(contributionScore));
            const sortedRows = rows.slice().sort((a, b) => contributionScore(b) - contributionScore(a) || b.rows - a.rows || a.host.localeCompare(b.host));
            const cards = sortedRows.map(row => {
                const score = contributionScore(row);
                const pct = score > 0 ? Math.max(3, Math.min(100, Math.round((score / maxContribution) * 100))) : 0;
                const currentText = row.currentCoin ? (row.currentRange ? `${row.currentCoin} ${row.currentRange}` : row.currentCoin) : '';
                const badge = row.mode || row.status || 'DL';
                const statusClass = row.status === 'failed' ? ' failed' : (row.status === 'done' ? ' done' : (score <= 0 ? ' waiting' : ''));

        function downloaderContributionTotal(job) {
            return getDownloaderRows(job).reduce((sum, row) => {
                return sum + numberValue(row.payloadBytes) + numberValue(row.rows) + numberValue(row.pages) + numberValue(row.segments) + numberValue(row.minutesWritten);
            }, 0);
        }

        function ensureDownloaderLogFallbacks(jobs) {
            (Array.isArray(jobs) ? jobs : []).forEach(job => {
                if (!job || job.type !== 'bitget_best_1m_distributed' || !job.id) return;
                const cached = downloaderLogCache.get(job.id);
                const now = Date.now();
                const hasLiveStats = downloaderContributionTotal(job) > 0;
                if (hasLiveStats && cached && now - Number(cached.ts || 0) < 30000) return;
                if (cached && now - Number(cached.ts || 0) < 5000) return;
                if (downloaderLogFetches.has(job.id)) return;
                downloaderLogFetches.add(job.id);
                fetch(`${API_BASE}/jobs/${job.id}/log?lines=0`, authOptions())
                    .then(resp => resp.ok ? resp.json() : null)
                    .then(payload => {
                        const lines = payload && Array.isArray(payload.log) ? payload.log : [];
                        downloaderLogCache.set(job.id, { ts: Date.now(), lines: lines });
                        if (currentTab === 'running' && activeJobsSnapshot.some(item => item && item.id === job.id)) {
                            const runningContainer = document.getElementById('jobs-running');
                            if (runningContainer) runningContainer.innerHTML = activeJobsSnapshot.map(renderActiveJob).join('');
                        }
                    })
                    .catch(err => console.warn('Downloader log fallback failed:', err))
                    .finally(() => downloaderLogFetches.delete(job.id));
            });
        }

        function formatTimestamp(ts) {
            if (!ts) return '';
            const d = new Date(Number(ts) * 1000);
            if (isNaN(d.getTime())) return String(ts);
            const pad = n => String(n).padStart(2, '0');
            return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()) + ' '
                 + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
        }

        function compareActiveJobs(a, b) {
            const aRunning = a && a.status === 'running';
            const bRunning = b && b.status === 'running';
            if (aRunning !== bRunning) return aRunning ? -1 : 1;

            const aCreated = parseFloat(a && a.created_ts || 0);
            const bCreated = parseFloat(b && b.created_ts || 0);
            if (aCreated !== bCreated) return aCreated - bCreated;

            return String(a && a.id || '').localeCompare(String(b && b.id || ''));
        }

        async function loadTab(tab) {
            const container = document.getElementById(`jobs-${tab}`);
            container.innerHTML = '<p class="loading">' + PBGuiI18n.t('common.loading') + '</p>';
            
            try {
                const resp = await fetch(`${API_BASE}/jobs/?states=${tab}&limit=50`, authOptions());
                const data = await resp.json();
                
                // Apply exchange filter + sort newest first
                const filteredJobs = (data.jobs || []).filter(matchesExchangeFilter);
                filteredJobs.sort((a, b) => (b.updated_ts || 0) - (a.updated_ts || 0));
                
                if (filteredJobs.length === 0) {
                    container.innerHTML = `<p class="no-jobs">${PBGuiI18n.t('sysmon.noJobs', {state: tabLabel(tab), exchange: EXCHANGE_FILTER ? ' ' + PBGuiI18n.t('sysmon.forExchange', {exchange: escapeHtml(EXCHANGE_FILTER)}) : ''})}</p>`;
                    return;
                }
                
                container.innerHTML = filteredJobs.map(renderJob).join('');
            } catch (e) {
                console.error(`Load ${tab} error:`, e);
                container.innerHTML = `<p class="error">${PBGuiI18n.t('sysmon.failedLoadJobs', {state: tabLabel(tab)})}</p>`;
            }
        }

        function handleJobActionClick(e) {
            const actionEl = e.target.closest('[data-job-action]');
            if (!actionEl) return;
            const action = actionEl.dataset.jobAction;
            const jobId = actionEl.dataset.jobId || '';
            if (action === 'run') runJob(jobId);
            else if (action === 'view') showJobDetails(jobId);
            else if (action === 'log') showLog(jobId);
            else if (action === 'cancel') cancelJob(jobId);
            else if (action === 'retry') retryJob(jobId);
            else if (action === 'requeue') requeueJob(jobId);
            else if (action === 'delete') deleteJob(jobId);
            else if (action === 'toggle') toggleExpander(jobId, e);
        }

        function handleDownloaderToggle(e) {
            const details = e.target.closest('details[data-downloader-job-id]');
            if (details) rememberDownloaderDetails(details.dataset.downloaderJobId, details.open);
        }

        document.addEventListener('click', handleJobActionClick);
        document.addEventListener('toggle', handleDownloaderToggle, true);

        // Close modal on outside click
        document.getElementById('log-modal').addEventListener('click', (e) => {
            if (e.target.id === 'log-modal') {
                closeLogModal();
            }
        });
        document.getElementById('details-modal').addEventListener('click', (e) => {
            if (e.target.id === 'details-modal') {
                closeDetailsModal();
            }
        });

        document.getElementById('action-modal').addEventListener('click', (e) => {
            if (e.target.id === 'action-modal') {
                closeActionDialog(false);
            }
        });
        document.getElementById('action-modal-close').addEventListener('click', () => closeActionDialog(false));
        document.getElementById('action-modal-cancel').addEventListener('click', () => closeActionDialog(false));
        document.getElementById('action-modal-accept').addEventListener('click', () => closeActionDialog(true));
        document.addEventListener('keydown', (e) => {
            const modal = document.getElementById('action-modal');
            if (!modal.classList.contains('active')) return;
            if (e.key === 'Escape') {
                e.preventDefault();
                closeActionDialog(false);
            } else if (e.key === 'Enter') {
                if (e.target && e.target.id === 'action-modal-cancel') return;
                e.preventDefault();
                closeActionDialog(true);
            }
        });

        // ── Initialize ──
        connectWebSocket();
    </script>
</body>
</html>
